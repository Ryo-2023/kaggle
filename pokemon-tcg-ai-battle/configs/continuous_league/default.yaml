model:
  state_size: 128
  action_size: 64
  hidden_size: 128
  recurrent_core: gru
  atoms: 51
  v_min: -1.0
  v_max: 1.0
  opponent_classes: 64
  deck_family_classes: 32
  action_type_classes: 32

learner:
  n_step: 5
  target_update_interval: 250
  gradient_clip: 40.0
  demonstration_margin: 0.8
  bc_weight: 0.0
  auxiliary_weight: 0.01
  conservative_weight: 0.05
  priority_eta: 0.9
  priority_epsilon: 0.000001
  demonstration_priority_bonus: 1.0

service:
  batch_size: 32
  learning_rate: 0.0001
  demonstration_ratio: 0.03125
  beta_start: 0.4
  beta_steps: 200000
  # 10,000 update ごとの RuntimePolicy を benchmark 対象とする。中断時は
  # learner が必ず最終 checkpoint を保存するため、細かい中間世代を残さない。
  checkpoint_interval: 10000
  progress_interval_seconds: 10.0
  seed: 71000
  device: cpu

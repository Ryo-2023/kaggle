# 1周期（Replay 30周程度）を前提にした CUDA learner 設定。
# 周回数そのものは `learn --max-replay-passes 30` で指定する。
model:
  state_size: 128
  action_size: 64
  hidden_size: 256
  recurrent_core: gru
  atoms: 51
  v_min: -1.0
  v_max: 1.0
  opponent_classes: 64
  deck_family_classes: 32
  action_type_classes: 32

learner:
  n_step: 5
  target_update_interval: 16
  gradient_clip: 40.0
  demonstration_margin: 0.8
  bc_weight: 0.0
  auxiliary_weight: 0.01
  conservative_weight: 0.05
  priority_eta: 0.9
  priority_epsilon: 0.000001
  demonstration_priority_bonus: 1.0

service:
  batch_size: 512
  learning_rate: 0.0002
  demonstration_ratio: 0.03125
  beta_start: 0.4
  beta_steps: 12500
  checkpoint_interval: 500
  progress_interval_seconds: 10.0
  seed: 71000
  device: cuda:0
  prepack_replay: true
  resident_replay: false
  pin_memory: true
  mixed_precision: bf16
  fused_optimizer: true
  matmul_precision: high
  learning_rate_schedule: cosine
  warmup_replay_passes: 1.0
  cosine_decay_replay_passes: 30.0
  minimum_learning_rate_scale: 0.1

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biohub-cell-tracking"
version = "0.1.0"
description = "Kaggle Biohub - Cell Tracking During Development workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.9.1",
  "tracksdata @ git+https://github.com/royerlab/tracksdata@7bfeaf845ceb951226f19b72fe5b80e01601018a",
  "zarr>=3.0.10",
  "scipy>=1.13",
  "polars>=1.36",
  "numpy>=2.0",
  "networkx>=3.0",
  "tqdm>=4.66",
  "kaggle>=1.7",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.12",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/biohub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

services:
  biohub:
    container_name: biohub-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /workspace/biohub-cell-tracking-during-development
    volumes:
      - ..:/workspace
      - ${HOME}/.kaggle:/root/.kaggle:ro
      - type: bind
        source: /run/host-services/ssh-auth.sock
        target: /run/host-services/ssh-auth.sock
      - biohub-uv-cache:/root/.cache/uv
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      CELLMOT_DATA_DIR: /workspace/biohub-cell-tracking-during-development/data/train
      SSH_AUTH_SOCK: /run/host-services/ssh-auth.sock
    stdin_open: true
    tty: true
    init: true
    command: sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "python --version >/dev/null 2>&1 && uv --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  biohub-uv-cache:
